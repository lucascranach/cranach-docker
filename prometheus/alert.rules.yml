groups:
  - name: node_exporter_alerts
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance)(irate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 90% for more than 5 minutes."

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% for more than 5 minutes."

      - alert: DiskSpaceLow
        expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "More than 85% of disk space used on root mount."

      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Prometheus target is not reachable for 2 minutes."

  - name: nodejs_api_alerts
    rules:
      - alert: HighHttp500Rate
        expr: rate(http_requests_total{status=~"5.."}[2m]) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High rate of HTTP 500 errors on {{ $labels.instance }}"
          description: "More than 1 HTTP 500 error per second over 2 minutes."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, instance)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High request latency on {{ $labels.instance }}"
          description: "95th percentile request latency is over 1s."

  - name: elasticsearch_alerts
    rules:
      - alert: ElasticsearchExporterDown
        expr: up{job="elasticsearch"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Elasticsearch exporter is down"
          description: "Prometheus cannot scrape the Elasticsearch exporter."

      - alert: ElasticsearchClusterDown
        expr: elasticsearch_clusterinfo_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Elasticsearch cluster appears down"
          description: "The exporter reports the cluster is not reachable."

      - alert: ElasticsearchDiskWatermarkReached
        expr: elasticsearch_filesystem_data_used_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elasticsearch disk space warning"
          description: "Data directory usage is above 85%."

      - alert: ElasticsearchTooManyOpenFiles
        expr: elasticsearch_process_open_files_percent >= 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Too many open files in Elasticsearch"
          description: "Elasticsearch is close to reaching the open files limit."
  - name: website_alerts
    rules:

      # --- 1. Harter Ausfall. Paged. -------------------------------------
      # `for: 5m` bei 30s-Scrape-Intervall = 11 aufeinanderfolgende Fehlschlaege.
      # Das bisherige `for: 1m` bei 60s-Intervall war bereits durch ZWEI
      # aufeinanderfolgende Fehlschlaege erfuellt, ein ~61s-Aussetzer paged also
      # als critical. Die Aufloesung bleibt sofort: der erste erfolgreiche
      # Probe beendet den Alarm.
      - alert: WebsiteDown
        expr: probe_success{job="blackbox", instance="https://lucascranach.org/"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Website {{ $labels.instance }} is down'
          description: 'All blackbox probes have failed for 5 minutes straight. Check probe_http_status_code, probe_duration_seconds and probe_http_duration_seconds by phase.'

      # --- 2. Blinder Fleck im Monitoring. Paged. ------------------------
      # Ein fehlgeschlagener Scrape schreibt Stale-Marker, wodurch
      # `probe_success == 0` leer zurueckkommt und WebsiteDown still aufloest.
      # Ohne diesen Waechter sieht ein toter blackbox-exporter exakt aus wie
      # eine gesunde Website.
      - alert: WebsiteProbeMissing
        expr: absent(probe_success{job="blackbox", instance="https://lucascranach.org/"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'No probe results for {{ $labels.instance }}'
          description: 'Prometheus has received no probe_success sample for 5 minutes. The website is currently not being monitored.'

      # --- 3. Kurze Aussetzer bleiben SICHTBAR, als warning. -------------
      # probe_success ist 0/1, daher ist count_over_time - sum_over_time exakt
      # die "Anzahl fehlgeschlagener Probes im Fenster". Anders als
      # avg_over_time ist das bei nur teilweise gefuelltem Fenster (nach einem
      # Prometheus-Neustart) schwellenstabil und braucht keinen count-Guard.
      # >2 = mindestens 3 Fehlschlaege in 30m ~= 90s Stoerung bei 30s-Takt.
      # Bei zu viel Rauschen auf >5 anheben.
      - alert: WebsiteProbeUnstable
        expr: >-
          count_over_time(probe_success{job="blackbox", instance="https://lucascranach.org/"}[30m])
          - sum_over_time(probe_success{job="blackbox", instance="https://lucascranach.org/"}[30m])
          > 2
        labels:
          severity: warning
        annotations:
          summary: 'Website probe unstable: {{ $value }} failed probes in 30m'
          description: 'Transient probe failures for {{ $labels.instance }} without a sustained outage. Check probe_http_duration_seconds by phase.'

      # --- 4-7. Phasen-Sichtbarkeit: den NAECHSTEN Fehlschlag
      #          selbsterklaerend machen. ---------------------------------
      - alert: WebsiteProbeSlow
        expr: probe_duration_seconds{job="blackbox"} > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Probe to {{ $labels.instance }} is slow'
          description: 'The probe has needed more than 2s for 10 minutes. The module timeout is 5s - if this keeps rising, probes will start failing.'

      - alert: WebsiteProbeDnsSlow
        expr: probe_dns_lookup_time_seconds{job="blackbox"} > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'DNS lookup for {{ $labels.instance }} is slow'
          description: 'Resolution via the Docker embedded resolver (127.0.0.11) took more than 1s for 10 minutes.'

      - alert: WebsiteHttpStatusUnexpected
        expr: probe_http_status_code{job="blackbox"} != 200 and probe_http_status_code{job="blackbox"} != 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }} answers with HTTP {{ $value }}'
          description: 'The origin is reachable but does not return 200. A 502/504 points at PHP-FPM on the origin, not at the network.'

      - alert: WebsiteCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400 < 21
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'TLS certificate for {{ $labels.instance }} expires soon'
          description: 'The certificate expires in less than 21 days.'

      # --- 8. Der Exporter selbst. ---------------------------------------
      - alert: BlackboxExporterConfigReloadFailed
        expr: blackbox_exporter_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'blackbox-exporter failed to load its configuration'
          description: 'The running exporter is using a stale or no config. Check `docker compose logs blackbox-exporter`.'
